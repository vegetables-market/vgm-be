server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true # JavaScriptからアクセス不可
        secure: false # 開発環境ではfalse（本番環境ではtrue）
        same-site: lax # CSRF対策
        max-age: 86400 # 24時間
        path: /

spring:
  config:
    # .env.local を必須で読み込む（optional: なし = ファイルがないと起動エラー）
    import: "optional:file:./.env.local[.properties]"
  application:
    name: vgm-backend
  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
  jpa:
    hibernate:
      #      コード修正後に、置き換える
      #      ddl-auto: validate
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        temp:
          use_jdbc_metadata_defaults: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Actuator設定
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# メール設定
mail:
  from:
    email: ${spring.mail.username:noreply@example.com}
    name: ${MAIL_FROM_NAME:VGM Application}

# CORS設定
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}


# メディア設定
vgm:
  media:
    jwt-secret: ${MEDIA_JWT_SECRET:your-256-bit-secret-must-be-very-long-and-secure}

# Firebase設定
firebase:
  credentials:
    path: ${FIREBASE_CREDENTIALS_PATH:}
    json: ${FIREBASE_CREDENTIALS_JSON:}

# Stripe設定
stripe:
  api:
    key: ${STRIPE_API_KEY:}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:}
