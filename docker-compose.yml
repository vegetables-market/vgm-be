version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vgm-be
    ports:
      - "8080:8080"
    environment:
      - IS_LOCAL=true
      # Docker起動時は .env.local の有無に関わらずローカルDBを強制使用
      - DB_URL=jdbc:postgresql://postgres:5432/myapp
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vgm-network

  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: vgm-postgres
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vgm-network

volumes:
  postgres_data:

networks:
  vgm-network:
    driver: bridge