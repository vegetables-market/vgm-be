name: Deploy to Cloud Run (Develop / Minimal)

on:
  push:
    branches: [develop]
    paths:
      - "**"
      - ".github/workflows/**"

env:
  REGION: asia-northeast1
  REPO_NAME: vgm-repo
  WORKDIR: .

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: gcp-dev

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Container
        working-directory: ${{ env.WORKDIR }}
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ vars.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "${IMAGE_TAG}" .
          docker push "${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          env_vars: |
            IS_TAILSCALE=true
            TAILSCALE_AUTH_KEY=${{ secrets.TAILSCALE_AUTH_KEY_CLOUDRUN }}
            TAILSCALE_VGM_DB_HOST=${{ vars.TAILSCALE_VGM_DB_HOST }}
            
            DB_NAME=${{ vars.DB_NAME }}
            DB_USER=${{ vars.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            MAIL_FROM_NAME=${{ vars.MAIL_FROM_NAME }}
            MAIL_USERNAME=${{ vars.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}

            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS_UI }}
            FIREBASE_CREDENTIALS_JSON=${{ secrets.FIREBASE_CREDENTIALS_JSON }}
            MEDIA_JWT_SECRET=${{ secrets.MEDIA_JWT_SECRET }}
          flags: --allow-unauthenticated --memory=2Gi --cpu=2 --timeout=300 --cpu-boost
