name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**'
      - '.github/workflows/**'

env:
  REGION: asia-northeast1
  REPO_NAME: vgm-repo
  WORKDIR: .

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - uses: actions/checkout@v4

      # ブランチに応じた環境変数の切り替え
      - name: Set environment specific variables
        id: env-vars
        run: |
          if [[ ${{ github.ref }} == 'refs/heads/main' ]]; then
            echo "Target: PRODUCTION"
            echo "SERVICE_NAME=vgm-backend" >> $GITHUB_ENV
          
            # 本番DBへの接続情報
            echo "DB_HOST_IP=${{ vars.TAILSCALE_VGM_DB_HOST }}" >> $GITHUB_ENV
            echo "DB_NAME=vgm_db_prod" >> $GITHUB_ENV
            echo "DB_USER=${{ vars.DB_USER }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          
            # 本番環境用の環境変数
            echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME_PROD }}" >> $GITHUB_ENV
            echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD_PROD }}" >> $GITHUB_ENV
            echo "MAIL_FROM_EMAIL=${{ vars.MAIL_FROM_EMAIL_PROD }}" >> $GITHUB_ENV
            echo "MAIL_FROM_NAME=${{ vars.MAIL_FROM_NAME_PROD }}" >> $GITHUB_ENV
            echo "STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY_PROD }}" >> $GITHUB_ENV
            echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET_PROD }}" >> $GITHUB_ENV
            echo "PAYPAY_API_KEY=${{ secrets.PAYPAY_API_KEY_PROD }}" >> $GITHUB_ENV
            echo "PAYPAY_API_SECRET=${{ secrets.PAYPAY_API_SECRET_PROD }}" >> $GITHUB_ENV
            echo "PAYPAY_API_BASE_URL=${{ vars.PAYPAY_API_BASE_URL_PROD }}" >> $GITHUB_ENV
            echo "PAYPAY_MERCHANT_ID=${{ vars.PAYPAY_MERCHANT_ID_PROD }}" >> $GITHUB_ENV
            echo "CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS_PROD }}" >> $GITHUB_ENV
            echo "PLATFORM_FEE_RATE=${{ vars.PLATFORM_FEE_RATE_PROD }}" >> $GITHUB_ENV
            
            # 本番はメモリを贅沢に使う
            echo "MEMORY=2Gi" >> $GITHUB_ENV
            echo "CPU=1" >> $GITHUB_ENV
            
          else
            echo "Target: DEVELOPMENT"
            echo "SERVICE_NAME=vgm-backend-dev" >> $GITHUB_ENV
          
            # 開発DBへの接続情報
            echo "DB_HOST_IP=${{ vars.TAILSCALE_VGM_DB_HOST }}" >> $GITHUB_ENV
            echo "DB_NAME=vgm_db_dev" >> $GITHUB_ENV
            echo "DB_USER=${{ vars.DB_USER }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          
            # 開発環境用の環境変数
            echo "MAIL_USERNAME=${{ secrets.MAIL_USERNAME_DEV }}" >> $GITHUB_ENV
            echo "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD_DEV }}" >> $GITHUB_ENV
            echo "MAIL_FROM_EMAIL=${{ vars.MAIL_FROM_EMAIL_DEV }}" >> $GITHUB_ENV
            echo "MAIL_FROM_NAME=${{ vars.MAIL_FROM_NAME_DEV }}" >> $GITHUB_ENV
            echo "STRIPE_API_KEY=${{ secrets.STRIPE_API_KEY_DEV }}" >> $GITHUB_ENV
            echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET_DEV }}" >> $GITHUB_ENV
            echo "PAYPAY_API_KEY=${{ secrets.PAYPAY_API_KEY_DEV }}" >> $GITHUB_ENV
            echo "PAYPAY_API_SECRET=${{ secrets.PAYPAY_API_SECRET_DEV }}" >> $GITHUB_ENV
            echo "PAYPAY_API_BASE_URL=${{ vars.PAYPAY_API_BASE_URL_DEV }}" >> $GITHUB_ENV
            echo "PAYPAY_MERCHANT_ID=${{ vars.PAYPAY_MERCHANT_ID_DEV }}" >> $GITHUB_ENV
            echo "CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS_DEV }}" >> $GITHUB_ENV
            echo "PLATFORM_FEE_RATE=${{ vars.PLATFORM_FEE_RATE_DEV }}" >> $GITHUB_ENV
            
            # 開発環境も起動安定のために同じスペックにする
            echo "MEMORY=2Gi" >> $GITHUB_ENV
            echo "CPU=1" >> $GITHUB_ENV
          fi

      # 1. Google Cloud 認証
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WIF_PROVIDER }}'
          service_account: '${{ secrets.GCP_SA_EMAIL }}'

      # 2. Docker認証
      - name: 'Docker Auth'
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # 3. ビルド & プッシュ
      - name: 'Build and Push Container'
        working-directory: ${{ env.WORKDIR }}
        run: |-
          # タグにコミットハッシュをつけてユニークにする
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          
          docker build -t "${IMAGE_TAG}" .
          docker push "${IMAGE_TAG}"
          
          # 次のステップで使うために環境変数にセット
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      # 4. Cloud Runへデプロイ
      - name: 'Deploy to Cloud Run'
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_TAG }}
          # 環境変数を注入
          env_vars: |
            TAILSCALE_AUTH_KEY=${{ secrets.TAILSCALE_AUTH_KEY }}
            TAILSCALE_VGM_DB_HOST=${{ env.DB_HOST_IP }}
            DB_URL=jdbc:postgresql://127.0.0.1:5432/${{ env.DB_NAME }}
            DB_USER=${{ env.DB_USER }}
            DB_PASSWORD=${{ env.DB_PASSWORD }}
            MAIL_USERNAME=${{ env.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ env.MAIL_PASSWORD }}
            MAIL_FROM_EMAIL=${{ env.MAIL_FROM_EMAIL }}
            MAIL_FROM_NAME=${{ env.MAIL_FROM_NAME }}
            STRIPE_API_KEY=${{ env.STRIPE_API_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ env.STRIPE_WEBHOOK_SECRET }}
            PAYPAY_API_KEY=${{ env.PAYPAY_API_KEY }}
            PAYPAY_API_SECRET=${{ env.PAYPAY_API_SECRET }}
            PAYPAY_API_BASE_URL=${{ env.PAYPAY_API_BASE_URL }}
            PAYPAY_MERCHANT_ID=${{ env.PAYPAY_MERCHANT_ID }}
            CORS_ALLOWED_ORIGINS=${{ env.CORS_ALLOWED_ORIGINS }}
            PLATFORM_FEE_RATE=${{ env.PLATFORM_FEE_RATE }}
#          flags: '--allow-unauthenticated --memory=${{ env.MEMORY }} --cpu=${{ env.CPU }}'
          flags: --allow-unauthenticated --memory=2Gi --cpu=2 --timeout=300 --cpu-boost